<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS Study Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>AWS Study Buddy</h1>

    <div class="modes" role="group" aria-label="Mode">
      <button type="button" id="mode-flash" aria-pressed="true">Flashcards</button>
      <button type="button" id="mode-quiz" aria-pressed="false">Quiz me</button>
    </div>

    <div id="flashcards">
      <section class="card" aria-live="polite">
        <p class="position" id="position"></p>
        <h2 class="service" id="service"></h2>

        <div class="answer" id="answer" hidden>
          <p class="category" id="category"></p>
          <p class="sentence" id="sentence"></p>
          <a class="docs" id="docs" target="_blank" rel="noopener">Read the AWS docs ↗</a>
        </div>
      </section>

      <div class="controls">
        <button type="button" id="prev">← Previous</button>
        <button type="button" id="show" class="primary">Show answer</button>
        <button type="button" id="next">Next →</button>
      </div>
      <div class="controls">
        <button type="button" id="shuffle">Shuffle</button>
      </div>
    </div>

    <div id="quiz" hidden>
      <label class="filter" for="quiz-category">
        Category
        <select id="quiz-category"></select>
      </label>

      <section class="card">
        <p class="position" id="quiz-progress" aria-live="polite"></p>

        <div id="quiz-question">
          <p class="prompt" id="quiz-prompt"></p>
          <div class="options" id="quiz-options"></div>
          <p class="result" id="quiz-result" aria-live="polite" hidden></p>

          <div class="answer" id="quiz-answer" hidden>
            <p class="category" id="quiz-answer-category"></p>
            <p class="sentence" id="quiz-answer-sentence"></p>
            <a class="docs" id="quiz-answer-docs" target="_blank" rel="noopener">Read the AWS docs ↗</a>
          </div>
        </div>

        <div id="quiz-summary" hidden>
          <h2 class="service" id="quiz-score"></h2>
        </div>
      </section>

      <div class="controls">
        <button type="button" id="quiz-next" class="primary" hidden>Next question</button>
        <button type="button" id="quiz-again" class="primary" hidden>Play again</button>
      </div>
    </div>
  </main>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
